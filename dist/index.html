<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon.svg">
<link rel="apple-touch-icon" href="icon.svg">
<title>Mi Explotación</title>
<meta name="claude:viewport-fit-sides" content="cover">
<meta name="theme-color" content="#2f5233">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow:wght@400;500;600&family=Barlow+Semi+Condensed:wght@500;600;700&display=swap">
<style>
/* Layout: barra lateral fija en escritorio, barra de pestañas inferior en móvil; contenido en tablas tipo registro oficial */
:root{
  --bg:#f3f5ef; --surface:#ffffff; --surface-2:#e9ede2; --line:#d5dccb;
  --fg:#1d261c; --muted:#5d6a58;
  --accent:#2f5233; --accent-fg:#ffffff;
  --agri:#3d6e2f; --gan:#8a4a2b; --api:#b8860b; --eco:#3a5a78; --alm:#6b5a3e; --agenda:#7a4d8a; --guiado:#1f6f78; --partes:#9a5b13; --taller:#5a5f66; --ventas:#2f7a5a;
  --ok:#2e7d32; --warn:#b26a00; --crit:#b3261e;
  --warn-bg:#fff4e0; --crit-bg:#fdecea; --ok-bg:#e8f3e8;
  --f-display:"Barlow Semi Condensed","Arial Narrow",system-ui,sans-serif;
  --f-body:"Barlow",system-ui,-apple-system,"Segoe UI",sans-serif;
  --r:6px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#141a13; --surface:#1c241b; --surface-2:#253024; --line:#344232;
  --fg:#e6ebe1; --muted:#9daa97; --accent:#8fbf7f; --accent-fg:#10170f;
  --agri:#8fbf7f; --gan:#d99a78; --api:#e8b94a; --eco:#8db4d6; --alm:#c9b38c; --agenda:#c29ad3; --guiado:#6cc5cf; --partes:#e0a35a; --taller:#b5bcc6; --ventas:#7fd0aa;
  --ok:#7fc683; --warn:#f0b450; --crit:#f2867e;
  --warn-bg:#3a2c12; --crit-bg:#3d1d1a; --ok-bg:#1d3320; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#141a13; --surface:#1c241b; --surface-2:#253024; --line:#344232;
  --fg:#e6ebe1; --muted:#9daa97; --accent:#8fbf7f; --accent-fg:#10170f;
  --agri:#8fbf7f; --gan:#d99a78; --api:#e8b94a; --eco:#8db4d6; --alm:#c9b38c; --agenda:#c29ad3; --guiado:#6cc5cf; --partes:#e0a35a; --taller:#b5bcc6; --ventas:#7fd0aa;
  --ok:#7fc683; --warn:#f0b450; --crit:#f2867e;
  --warn-bg:#3a2c12; --crit-bg:#3d1d1a; --ok-bg:#1d3320; color-scheme:dark}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--fg);font:15px/1.45 var(--f-body)}
h1,h2,h3{font-family:var(--f-display);text-wrap:balance;margin:0;line-height:1.15}
h1{font-size:1.7rem;font-weight:700}
h2{font-size:1.25rem;font-weight:600}
h3{font-size:1.02rem;font-weight:600}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.app{display:grid;grid-template-columns:220px 1fr;min-height:100%}
nav.side{background:var(--surface);border-right:1px solid var(--line);padding:18px 12px;display:flex;flex-direction:column;gap:4px;position:sticky;top:0;height:100vh}
.brand{font-family:var(--f-display);font-weight:700;font-size:1.25rem;padding:4px 10px 16px;display:flex;gap:8px;align-items:center}
.brand svg{flex:none}
.nav-btn{display:flex;align-items:center;gap:10px;padding:9px 10px;border-radius:var(--r);border:0;background:none;cursor:pointer;text-align:left;font-weight:500;color:var(--fg)}
.nav-btn:hover{background:var(--surface-2)}
.nav-btn[aria-current="page"]{background:var(--surface-2);box-shadow:inset 3px 0 0 var(--mc,var(--accent))}
.nav-btn .dot{width:10px;height:10px;border-radius:50%;background:var(--mc,var(--accent));flex:none}
main{min-width:0;padding-block:22px 90px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.wrap{max-width:1180px;margin:0 auto;display:flex;flex-direction:column;gap:18px}
.head{display:flex;flex-wrap:wrap;gap:10px 16px;align-items:end;justify-content:space-between}
.head p{margin:2px 0 0;color:var(--muted)}
.eyebrow{font-size:.75rem;letter-spacing:.08em;text-transform:uppercase;color:var(--mc,var(--muted));font-weight:600}
.tabs{display:flex;gap:4px;overflow-x:auto;border-bottom:1px solid var(--line);scrollbar-width:thin}
.tab{border:0;background:none;padding:9px 12px;cursor:pointer;white-space:nowrap;color:var(--muted);font-weight:500;border-bottom:3px solid transparent;margin-bottom:-1px}
.tab[aria-selected="true"]{color:var(--fg);border-bottom-color:var(--mc,var(--accent))}
.btn{border:1px solid var(--line);background:var(--surface);padding:7px 12px;border-radius:var(--r);cursor:pointer;font-weight:500;display:inline-flex;align-items:center;gap:6px}
.btn:hover{background:var(--surface-2)}
.btn.primary{background:var(--accent);color:var(--accent-fg);border-color:var(--accent)}
.btn.primary:hover{filter:brightness(1.08)}
.btn.danger{color:var(--crit);border-color:var(--crit)}
.toolbar{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.toolbar .grow{flex:1 1 180px;min-width:0}
input[type=search],input[type=text],input[type=number],input[type=date],select,textarea{width:100%;padding:8px 10px;border:1px solid var(--line);border-radius:var(--r);background:var(--surface)}
textarea{min-height:70px;resize:vertical}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:10px}
.stat{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:12px 14px;display:flex;flex-direction:column;gap:2px}
.stat .k{font-size:.78rem;color:var(--muted);text-transform:uppercase;letter-spacing:.06em;font-weight:600}
.stat .v{font-family:var(--f-display);font-size:1.7rem;font-weight:700;font-variant-numeric:tabular-nums}
.stat .s{font-size:.85rem;color:var(--muted)}
.stat{box-shadow:inset 0 3px 0 var(--mc,var(--line))}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:14px;display:flex;flex-direction:column;gap:10px;min-width:0}
.grid2{display:grid;grid-template-columns:repeat(auto-fit,minmax(320px,1fr));gap:14px}
.table-wrap{overflow-x:auto;background:var(--surface);border:1px solid var(--line);border-radius:var(--r)}
table{border-collapse:collapse;width:100%;font-variant-numeric:tabular-nums}
th,td{padding:8px 10px;text-align:left;border-bottom:1px solid var(--line);white-space:nowrap;vertical-align:top}
td.wrap-cell{white-space:normal;min-width:160px}
th{font-size:.75rem;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);background:var(--surface-2);font-weight:600;position:sticky;top:0}
tbody tr{cursor:pointer}
tbody tr:hover{background:var(--surface-2)}
tbody tr:last-child td{border-bottom:0}
td.num{text-align:right}
.empty{padding:28px;text-align:center;color:var(--muted)}
.pill{display:inline-block;padding:1px 8px;border-radius:99px;font-size:.78rem;font-weight:600;background:var(--surface-2);color:var(--muted)}
.pill.ok{background:var(--ok-bg);color:var(--ok)}
.pill.warn{background:var(--warn-bg);color:var(--warn)}
.pill.crit{background:var(--crit-bg);color:var(--crit)}
.alerts{display:flex;flex-direction:column;gap:6px;margin:0;padding:0;list-style:none}
.alerts li{display:flex;gap:10px;align-items:flex-start;padding:8px 10px;border-radius:var(--r);background:var(--surface-2);border-left:4px solid var(--muted)}
.alerts li.warn{border-left-color:var(--warn);background:var(--warn-bg)}
.alerts li.crit{border-left-color:var(--crit);background:var(--crit-bg)}
.alerts li.ok{border-left-color:var(--ok);background:var(--ok-bg)}
.alerts .when{margin-left:auto;font-size:.82rem;color:var(--muted);white-space:nowrap}
.alerts small{display:block;color:var(--muted)}
.banner{display:flex;flex-wrap:wrap;gap:10px;align-items:center;justify-content:space-between;padding:10px 14px;border-radius:var(--r);background:var(--warn-bg);color:var(--fg);border:1px solid var(--line)}
.bar{display:flex;align-items:center;gap:8px;font-size:.9rem}
.bar .track{flex:1;height:10px;background:var(--surface-2);border-radius:5px;overflow:hidden}
.bar .fill{height:100%;background:var(--mc,var(--accent))}
.bar .lbl{width:110px;flex:none;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.bar .n{width:70px;text-align:right;font-variant-numeric:tabular-nums;flex:none}
dialog{border:1px solid var(--line);border-radius:10px;padding:0;background:var(--surface);color:var(--fg);width:min(720px,calc(100vw - 24px));max-height:calc(100vh - 40px)}
dialog::backdrop{background:rgba(10,15,10,.5)}
.dlg{display:flex;flex-direction:column;max-height:calc(100vh - 42px)}
.dlg header{padding:14px 18px;border-bottom:1px solid var(--line);display:flex;justify-content:space-between;align-items:center;gap:10px}
.dlg .body{padding:16px 18px;overflow:auto;display:grid;grid-template-columns:1fr 1fr;gap:12px}
.dlg footer{padding:12px 18px;border-top:1px solid var(--line);display:flex;gap:8px;flex-wrap:wrap;justify-content:flex-end}
.dlg footer .left{margin-right:auto;display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.fld{display:flex;flex-direction:column;gap:4px;min-width:0}
.fld.full{grid-column:1/-1}
.fld label{font-size:.82rem;font-weight:600;color:var(--muted)}
.fld .help{font-size:.78rem;color:var(--muted)}
.fld.chk{flex-direction:row;align-items:center;gap:8px}
.fld.chk input{width:auto}
.x{border:0;background:none;font-size:1.4rem;cursor:pointer;color:var(--muted);line-height:1}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(84px + env(safe-area-inset-bottom,0px));background:var(--fg);color:var(--bg);padding:9px 16px;border-radius:var(--r);font-weight:500;z-index:50}
.muted{color:var(--muted)}
.kv{display:grid;grid-template-columns:auto 1fr;gap:4px 14px;font-size:.92rem}
.kv dt{color:var(--muted)}
.kv dd{margin:0}
@media (max-width:820px){
  .app{grid-template-columns:1fr}
  nav.side{position:fixed;top:auto;bottom:0;left:0;right:0;height:auto;flex-direction:row;justify-content:space-around;padding:6px max(6px,env(safe-area-inset-right,0px)) calc(6px + env(safe-area-inset-bottom,0px)) max(6px,env(safe-area-inset-left,0px));border-right:0;border-top:1px solid var(--line);z-index:20;gap:0}
  .brand{display:none}
  nav.side{justify-content:flex-start;overflow-x:auto;scrollbar-width:none}
  .nav-btn{flex-direction:column;gap:3px;font-size:.72rem;padding:6px 4px;flex:0 0 68px;align-items:center;white-space:nowrap}
  .nav-btn[aria-current="page"]{box-shadow:inset 0 3px 0 var(--mc,var(--accent))}
  .dlg .body{grid-template-columns:1fr}
  h1{font-size:1.45rem}
}
@media print{nav.side,.toolbar,.tabs,.banner,.no-print{display:none!important}.app{display:block}main{padding:0}.table-wrap{border:0}}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
/* Calendario */
.cal{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:4px}
.cal-h{font-size:.75rem;font-weight:600;color:var(--muted);text-align:center;padding:2px}
.cal-c{min-height:84px;background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:4px 5px;display:flex;flex-direction:column;gap:3px;text-align:left;cursor:pointer;min-width:0;overflow:hidden}
.cal-c.out{background:transparent;border:0;cursor:default}
.cal-c.hoy .cal-n{background:var(--accent);color:var(--accent-fg);border-radius:99px;padding:0 6px}
.cal-c.sel{outline:2px solid var(--mc,var(--accent));outline-offset:-1px}
.cal-n{font-weight:600;font-variant-numeric:tabular-nums;align-self:flex-start}
.cal-dots{display:flex;gap:3px;align-items:center;flex-wrap:wrap}
.cal-dots i{width:7px;height:7px;border-radius:50%;display:block}
.cal-dots small{font-size:.65rem;color:var(--muted)}
.cal-t{display:flex;flex-direction:column;gap:2px}
.cal-t span{font-size:.7rem;line-height:1.2;border-left:3px solid;padding-left:4px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
@media (max-width:820px){.cal-c{min-height:52px}.cal-t{display:none}}
/* Adjuntos */
.adj-list{display:flex;flex-wrap:wrap;gap:8px}
.adj-list:empty{display:none}
.adj{position:relative;display:flex;align-items:center;gap:4px;background:var(--surface-2);border-radius:var(--r);padding:4px}
.adj img{width:88px;height:88px;object-fit:cover;border-radius:4px;display:block}
.adj audio{height:36px;max-width:230px}
.adj .x{position:absolute;top:-6px;right:-6px;background:var(--surface);border:1px solid var(--line);border-radius:50%;width:24px;height:24px;font-size:1rem;display:grid;place-items:center}
/* Mapa */
.map-box{position:relative}
#map{height:min(68vh,620px);min-height:340px;border-radius:var(--r);border:1px solid var(--line);background:var(--surface-2)}
.map-draw{position:absolute;left:10px;right:10px;bottom:10px;z-index:500;background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:10px 12px;display:flex;flex-direction:column;gap:6px;box-shadow:0 4px 16px rgba(0,0,0,.25)}
.map-lbl{background:rgba(255,255,255,.85);border:0;box-shadow:none;font:600 11px var(--f-body);color:#1d261c;padding:1px 5px}
.map-lbl::before{display:none}
.map-hive{background:#b8860b;color:#fff;border:2px solid #fff;border-radius:6px;transform:rotate(0);display:grid!important;place-items:center;font:700 12px var(--f-body);box-shadow:0 1px 4px rgba(0,0,0,.4)}
.leaflet-popup-content{font:14px/1.4 var(--f-body)}
.leaflet-popup-content .btn{margin-top:6px;font-size:.85rem;padding:4px 8px}
/* Tiempo */
.wx-strip{display:flex;gap:2px;overflow-x:auto;padding-bottom:4px}
.wx-h{flex:0 0 22px;display:flex;flex-direction:column;align-items:center;gap:2px;font-size:.65rem;color:var(--muted);position:relative;padding-top:14px}
.wx-h b{position:absolute;top:0;left:0;font-size:.68rem;color:var(--fg);white-space:nowrap}
.wx-h i{display:block;width:100%;height:26px;border-radius:3px;background:var(--surface-2)}
.wx-h.si i{background:var(--ok)}
/* Informes */
.rep-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:12px}
pre.code{background:var(--surface-2);padding:10px;border-radius:var(--r);overflow-x:auto;font-size:.78rem;white-space:pre;margin:6px 0}
/* Guiado GPS */
:root{--g-bg:#10180f;--g-field:rgba(143,191,127,.10);--g-edge:#8fbf7f;--g-cov:rgba(110,200,120,.42);--g-cov-on:rgba(110,220,130,.9);--g-line:rgba(230,235,225,.35);--g-line-on:#ffd23f;--g-track:rgba(255,255,255,.5);--g-car:#5ab0ff;--g-muted:#9daa97}
.g-wrap{background:var(--g-bg);border-radius:10px;padding:10px;display:flex;flex-direction:column;gap:8px;color:#e6ebe1}
.g-bar{display:flex;flex-direction:column;align-items:center;gap:6px}
.g-leds{display:flex;gap:4px;width:100%;max-width:560px}
.g-leds i{flex:1;height:18px;border-radius:3px;background:#2a3328}
.g-leds i.c{background:#3c6e3a}
.g-leds i.a{background:#ffb020}
.g-leds i.r{background:#ff4d3d}
.g-txt{font:700 1.5rem/1.1 var(--f-display);font-variant-numeric:tabular-nums;color:#e6ebe1}
.g-txt.ok{color:#7fe08a}.g-txt.warn{color:#ffc04d}.g-txt.crit{color:#ff7a6e}
.g-view{position:relative}
#gCanvas{width:100%;height:min(58vh,560px);min-height:300px;display:block;border-radius:6px;touch-action:none}
.g-zoom{position:absolute;right:8px;top:8px;display:flex;flex-direction:column;gap:6px}
.g-zoom .btn{width:42px;height:42px;justify-content:center;font-size:1.3rem;background:rgba(30,40,30,.85);color:#fff;border-color:#445}
.g-stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(100px,1fr));gap:6px}
.g-stats div{background:#1c241b;border-radius:6px;padding:6px 8px;display:flex;flex-direction:column}
.g-stats span{font-size:.7rem;text-transform:uppercase;letter-spacing:.06em;color:#9daa97}
.g-stats b{font:700 1.15rem var(--f-display);font-variant-numeric:tabular-nums}
.g-stats b.g-bad{color:#ffc04d}
.g-wrap .btn{background:#253024;color:#e6ebe1;border-color:#344232}
.g-wrap .btn.primary{background:#8fbf7f;color:#10170f;border-color:#8fbf7f}
.g-wrap .btn.danger{color:#ff7a6e;border-color:#ff7a6e}
.g-wrap .btn[disabled]{opacity:.45;cursor:not-allowed}
.btn[disabled]{opacity:.5;cursor:not-allowed}

/* Firma */
.firma-box{position:relative;height:150px;border:1px dashed var(--line);border-radius:var(--r);background:#fff;touch-action:none}
.firma-box canvas{position:absolute;inset:0;width:100%;height:100%;cursor:crosshair}
.firma-box img{position:absolute;inset:0;width:100%;height:100%;object-fit:contain;pointer-events:none}

/* Taller */
.taller-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(340px,1fr));gap:14px}
@media (max-width:420px){.taller-grid{grid-template-columns:1fr}}
.taller-card .head p{margin:0}
.mant-list{display:flex;flex-direction:column;gap:8px}
.mant{display:grid;grid-template-columns:1fr;gap:3px;border:0;background:none;padding:0;text-align:left;cursor:pointer}
.mant-t{font-weight:600;font-size:.9rem}
.mant .track{height:8px;background:var(--surface-2);border-radius:4px;overflow:hidden;display:block}
.mant .fill{display:block;height:100%;background:var(--ok)}
.mant .fill.warn{background:var(--warn)}.mant .fill.crit{background:var(--crit)}
.mant small{font-size:.8rem}
.crit-t{color:var(--crit)}.warn-t{color:var(--warn)}
/* Hoy */
.hoy .head{flex-wrap:wrap;gap:8px}
.hoy-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:16px}
.hoy-col{min-width:0}
.hoy-col h3{margin:0 0 8px;font-size:1rem}
.hoy-wx{display:flex;gap:14px;align-items:flex-start;margin-bottom:8px}
.hoy-t{font-size:2rem;font-weight:700;line-height:1;white-space:nowrap}
.hoy-wx .kv{margin:0;flex:1;min-width:0}
/* Líneas de factura */
table.lin input,table.lin select{width:100%;min-width:60px;padding:6px}
table.lin td{padding:4px}
table.lin .num input{text-align:right}
/* Trazabilidad */
ol.traz-line{list-style:none;padding:0;margin:0;border-left:3px solid var(--ventas);}
ol.traz-line li{position:relative;padding:6px 0 10px 16px}
ol.traz-line li::before{content:"";position:absolute;left:-8px;top:10px;width:12px;height:12px;border-radius:50%;background:var(--surface);border:3px solid var(--ventas)}
ol.traz-line li.o::before{border-color:var(--ok, #3d6e2f)}
ol.traz-line li.bad::before{border-color:var(--crit, #b3261e);background:var(--crit, #b3261e)}
/* Dictado */
.con-mic{display:flex;gap:6px;align-items:flex-start}
.con-mic>input,.con-mic>textarea{flex:1;min-width:0}
.mic{flex:none;width:40px;height:40px;border-radius:50%;border:1px solid var(--line, #ccc);background:var(--surface-2);cursor:pointer;font-size:1.1rem}
.mic.on{background:#c62828;color:#fff;border-color:#c62828;animation:pulso 1s infinite}
.voz-box{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);z-index:3000;background:var(--surface);border:1px solid var(--line, #ccc);border-radius:16px;box-shadow:0 10px 30px rgba(0,0,0,.25);padding:18px 20px;width:min(420px,calc(100vw - 32px));text-align:center;display:flex;flex-direction:column;gap:8px;align-items:center}
.voz-box p{margin:0}
.voz-pulse{width:64px;height:64px;border-radius:50%;background:#c62828;color:#fff;display:grid;place-items:center;font-size:1.8rem;animation:pulso 1s infinite}
@keyframes pulso{0%{box-shadow:0 0 0 0 rgba(198,40,40,.5)}100%{box-shadow:0 0 0 14px rgba(198,40,40,0)}}
ol.traz-line li strong{display:block}
ol.traz-line li span{display:block;color:var(--muted, inherit)}
/* SIGPAC */
.sig-pop{font-size:.88rem}
.sig-pop .kv{margin:6px 0;grid-template-columns:auto 1fr;gap:2px 8px}
.sig-pop .toolbar{gap:6px;flex-wrap:wrap}
.sig-pop .btn{padding:6px 10px;font-size:.85rem}
.sig-ref{font-family:ui-monospace,monospace;font-size:.82rem;color:var(--muted)}

function edad(n){ if(!n) return ""; const m = Math.floor(daysBetween(n,today())/30.44); return m<24? `${m} meses` : `${Math.floor(m/12)} años`; }
function finEspera(r,k){ if(r[k]===""||r[k]==null) return ""; return fdate(addDays(r.fecha, Number(r.duracion||1)-1 + Number(r[k]))); }
function enEspera(r,k){ if(r[k]===""||r[k]==null) return false; return addDays(r.fecha, Number(r.duracion||1)-1 + Number(r[k])) >= today(); }
function ultimaRevision(apId){ return DB.revisiones.filter(v=>v.apiario===apId).map(v=>v.fecha).sort().pop(); }

/* ============ Almacenamiento (IndexedDB con respaldo) ============ */
let DB = {};
const STORE_KEY = "mi-explotacion-v1";
function blank(){ const d = {_meta:{titular:{}, version:2, del:{}}}; for (const t in S) d[t] = []; return d; }
let _idb = null;
function idb(){ if (_idb) return _idb; _idb = new Promise((res, rej) => { try { const rq = indexedDB.open("mi-explotacion", 2); rq.onupgradeneeded = () => { const db = rq.result; for (const s of ["kv","files","snaps"]) if (!db.objectStoreNames.contains(s)) db.createObjectStore(s); }; rq.onsuccess = () => res(rq.result); rq.onerror = () => rej(rq.error); } catch(e){ rej(e); } }); _idb.catch(()=>{ _idb = null; }); return _idb; }
async function idbGet(store, key){ const db = await idb(); return new Promise((res, rej) => { const rq = db.transaction(store).objectStore(store).get(key); rq.onsuccess = () => res(rq.result); rq.onerror = () => rej(rq.error); }); }
async function idbPut(store, key, val){ const db = await idb(); return new Promise((res, rej) => { const tx = db.transaction(store, "readwrite"); tx.objectStore(store).put(val, key); tx.oncomplete = res; tx.onerror = () => rej(tx.error); }); }
async function idbDel(store, key){ const db = await idb(); return new Promise((res, rej) => { const tx = db.transaction(store, "readwrite"); tx.objectStore(store).delete(key); tx.oncomplete = res; tx.onerror = () => rej(tx.error); }); }
async function idbKeys(store){ const db = await idb(); return new Promise((res, rej) => { const rq = db.transaction(store).objectStore(store).getAllKeys(); rq.onsuccess = () => res(rq.result); rq.onerror = () => rej(rq.error); }); }
const now = () => Date.now();
function tomb(id){ DB._meta.del = DB._meta.del || {}; DB._meta.del[id] = now(); }
async function load(){
  let data = null;
  try { const db = await idb(); data = await new Promise((res, rej) => { const rq = db.transaction("kv").objectStore("kv").get(STORE_KEY); rq.onsuccess = () => res(rq.result); rq.onerror = () => rej(rq.error); }); } catch(e) {}
  if (!data) { try { const s = localStorage.getItem(STORE_KEY); if (s) data = JSON.parse(s); } catch(e) {} }
  return data;
}
let saveFailed = false;
async function save(){
  const snapshot = JSON.parse(JSON.stringify(DB));
  let ok = false;
  try { await idbPut("kv", STORE_KEY, snapshot); ok = true; } catch(e) {}
  if (!ok) try { localStorage.setItem(STORE_KEY, JSON.stringify(snapshot)); ok = true; } catch(e) {}
  if (!ok && !saveFailed) toast("No se pudo guardar en este navegador. Exporta una copia de seguridad.");
  saveFailed = !ok;
  for (const f of AFTER_SAVE) try { f(); } catch(e) { console.warn(e); }
}
function normalize(d){ const b = blank(); for (const t in b) if (Array.isArray(d?.[t])) b[t] = d[t]; if (d?._meta) b._meta = {...b._meta, ...d._meta, titular:{...(d._meta.titular||{})}, del:{...(d._meta.del||{})}}; return b; }

function alertas(){
  const A = [], hoy = today();
  for (const r of DB.fitosanitarios) if (r.plazo) { const fin = addDays(r.fecha, r.plazo); if (fin >= hoy) A.push({lv:"warn", t:`No cosechar en ${refName("parcelas", r.parcela)}`, s:`Plazo de seguridad de ${r.producto}`, d:fin, mod:"agri", tab:"fitosanitarios"}); }
  for (const r of DB.veterinarios) for (const [k, n] of [["sup_carne","carne"],["sup_leche","leche"]]) if (enEspera(r,k)) A.push({lv:"crit", t:`${r.animal}: tiempo de espera de ${n}`, s:`${r.medicamento}. No destinar ${n} a consumo.`, d:addDays(r.fecha, Number(r.duracion||1)-1+Number(r[k])), mod:"gan", tab:"veterinarios"});
  for (const r of DB.apitratamientos) if (r.retirada && !r.retirado) A.push({lv: r.retirada < hoy ? "crit" : (daysBetween(hoy, r.retirada) <= 7 ? "warn" : ""), t:`Retirar ${r.producto}`, s:`${refName("apiarios", r.apiario)}${r.retirada<hoy?" · fecha pasada":""}`, d:r.retirada, mod:"api", tab:"apitratamientos"});
  for (const a of DB.apiarios) { const u = ultimaRevision(a.id); if (!u || daysBetween(u, hoy) > 21) A.push({lv:"warn", t:`Revisar el apiario ${a.nombre}`, s: u ? `Última revisión hace ${daysBetween(u,hoy)} días` : "Sin revisiones registradas", d:"", mod:"api", tab:"revisiones"}); }
  for (const c of DB.colmenas) if (c.estado === "Huérfana") A.push({lv:"crit", t:`Colmena ${c.codigo} huérfana`, s:refName("apiarios", c.apiario), d:"", mod:"api", tab:"colmenas"});
  for (const f of ALERTS) try { A.push(...f()); } catch(e) { console.warn(e); }
  const ord = {crit:0, warn:1, "":2};
  return A.sort((a,b) => ord[a.lv]-ord[b.lv] || (a.d||"9").localeCompare(b.d||"9"));
}

/* ---- Módulos ---- */
function cellVal(t, c, r){
  if (typeof c === "object") return c.f(r);
  const f = S[t].fields.find(x=>x.k===c);
  const v = r[c];
  if (!f) return v;
  if (f.t === "date") return fdate(v);
  if (f.t === "ref") return refName(f.ref, v);
  if (f.t === "num") return fnum(v);
  if (f.t === "chk") return v ? "Sí" : "No";
  return v;
}
function colLabel(t, c){ return typeof c === "object" ? c.l : (S[t].fields.find(x=>x.k===c)?.l || c).replace(/\s*\(.*\)$/,"") + (/(ha)\)$/.test(S[t].fields.find(x=>x.k===c)?.l||"") ? " (ha)" : ""); }
function filtered(t){
  const q = UI.q.trim().toLowerCase();
  const hasDate = S[t].fields.some(f=>f.k==="fecha");
  let rows = DB[t].slice();
  if (hasDate && UI.year !== "todos") rows = rows.filter(r => (r.fecha||"").startsWith(UI.year));
  if (t === "cultivos" && UI.year !== "todos") rows = rows.filter(r => String(r.campana) === UI.year);
  if (q) rows = rows.filter(r => S[t].cols.some(c => String(cellVal(t,c,r) ?? "").toLowerCase().includes(q)));
  if (hasDate) rows.sort((a,b)=>(b.fecha||"").localeCompare(a.fecha||""));
  return rows;
}
function years(){ const s = new Set([String(new Date().getFullYear())]); for (const t in S) for (const r of DB[t]) { if (r.fecha) s.add(r.fecha.slice(0,4)); if (r.campana) s.add(String(r.campana)); } return [...s].sort().reverse(); }

function resumen(mod){
  if (mod === "agri"){
    const usos = {}; for (const p of DB.parcelas) { const u = (p.uso||"Sin uso").split(" · ").pop(); usos[u] = (usos[u]||0) + Number(p.superficie||0); }
    const tot = Object.values(usos).reduce((a,b)=>a+b,0) || 1;
    return Object.keys(usos).length ? `<section class="panel"><h3>Superficie por uso</h3>${Object.entries(usos).sort((a,b)=>b[1]-a[1]).map(([u,h])=>`<div class="bar"><span class="lbl">${esc(u)}</span><span class="track"><span class="fill" style="width:${h/tot*100}%;display:block"></span></span><span class="n">${fnum(h)} ha</span></div>`).join("")}</section>` : "";
  }
  if (mod === "gan"){
    const act = DB.animales.filter(a=>a.estado!=="Baja");
    if (!act.length) return "";
    const rows = ESPECIES.map(e => { const g = act.filter(a=>a.especie===e); return g.length ? `<tr><td>${e}</td><td class="num">${g.filter(a=>a.sexo==="Hembra").length}</td><td class="num">${g.filter(a=>a.sexo!=="Hembra").length}</td><td class="num">${g.filter(a=>a.nacimiento&&daysBetween(a.nacimiento,today())<365).length}</td><td class="num"><strong>${g.length}</strong></td></tr>` : ""; }).join("");
    return `<section class="panel"><h3>Censo actual</h3><div class="table-wrap"><table><thead><tr><th>Especie</th><th>Hembras</th><th>Machos</th><th>Menores de 1 año</th><th>Total</th></tr></thead><tbody>${rows}</tbody></table></div></section>`;
  }
  if (mod === "api"){
    if (!DB.apiarios.length) return "";
    const max = Math.max(1, ...DB.apiarios.map(a=>DB.colmenas.filter(c=>c.apiario===a.id&&c.estado!=="Muerta"&&c.estado!=="Vendida").length));
    return `<section class="panel"><h3>Colmenas activas por apiario</h3>${DB.apiarios.map(a=>{const n=DB.colmenas.filter(c=>c.apiario===a.id&&c.estado!=="Muerta"&&c.estado!=="Vendida").length;return `<div class="bar"><span class="lbl">${esc(a.nombre)}</span><span class="track"><span class="fill" style="width:${n/max*100}%;display:block"></span></span><span class="n">${n}</span></div>`;}).join("")}</section>`;
  }
  if (mod === "eco"){
    const rows = filtered("economia");
    const by = {}; for (const r of rows) { const m = r.modulo||"General"; by[m] = by[m] || {i:0,g:0}; by[m][r.tipo==="Ingreso"?"i":"g"] += Number(r.importe||0); }
    const ent = Object.entries(by); if (!ent.length) return "";
    const T = ent.reduce((a,[,v])=>({i:a.i+v.i, g:a.g+v.g}),{i:0,g:0});
    return `<section class="panel"><h3>Resumen ${UI.year==="todos"?"total":UI.year}</h3><div class="table-wrap"><table><thead><tr><th>Actividad</th><th>Ingresos</th><th>Gastos</th><th>Resultado</th></tr></thead><tbody>${ent.map(([m,v])=>`<tr><td>${esc(m)}</td><td class="num">${eur.format(v.i)}</td><td class="num">${eur.format(v.g)}</td><td class="num">${eur.format(v.i-v.g)}</td></tr>`).join("")}<tr><td><strong>Total</strong></td><td class="num"><strong>${eur.format(T.i)}</strong></td><td class="num"><strong>${eur.format(T.g)}</strong></td><td class="num"><strong>${eur.format(T.i-T.g)}</strong></td></tr></tbody></table></div></section>`;
  }
  return "";
}

function viewModulo(mod){
  const m = MODS[mod], t = UI.tab[mod] && m.tables.includes(UI.tab[mod]) ? UI.tab[mod] : m.tables[0];
  UI.tab[mod] = t;
  const tabsBar = m.tables.length > 1 ? `<div class="tabs" role="tablist">${m.tables.map(x=>`<button class="tab" role="tab" data-go="${mod}" data-tab="${x}" aria-selected="${x===t}">${isTable(x)?S[x].title:TABS[x].title}${isTable(x)?` <span class="muted">${DB[x].length}</span>`:""}</button>`).join("")}</div>` : "";
  if (!isTable(t)) return `${demoBanner()}<div class="head"><div><div class="eyebrow">${m.name}</div><h1>${m.desc}</h1></div></div>${tabsBar}${TABS[t].render(mod)}`;
  const sch = S[t], rows = filtered(t);
  const hasDate = sch.fields.some(f=>f.k==="fecha") || t === "cultivos";
  return `${demoBanner()}
  <div class="head"><div><div class="eyebrow">${m.name}</div><h1>${m.desc}</h1></div></div>
  ${tabsBar}
  ${t === m.tables[0] || mod === "eco" ? resumen(mod) : ""}
  <div class="head"><div><h2>${sch.title}</h2>${sch.help?`<p>${sch.help}</p>`:""}</div></div>
  <div class="toolbar">
    <input class="grow" type="search" id="q" placeholder="Buscar en ${sch.title.toLowerCase()}" value="${esc(UI.q)}" aria-label="Buscar">
    ${hasDate ? `<select id="year" aria-label="Año" style="width:auto">${["todos",...years()].map(y=>`<option value="${y}" ${UI.year===y?"selected":""}>${y==="todos"?"Todos los años":(t==="cultivos"?"Campaña ":"")+y}</option>`).join("")}</select>` : ""}
    <button class="btn" data-act="csv" data-t="${t}" title="Descargar en formato CSV para Excel">Exportar CSV</button>
    <button class="btn primary" data-new="${t}">+ Añadir ${sch.one}</button>
  </div>
  <div class="table-wrap">${rows.length ? `<table><thead><tr>${sch.cols.map(c=>`<th>${esc(colLabel(t,c))}</th>`).join("")}</tr></thead><tbody>${rows.map(r=>`<tr data-edit="${t}" data-id="${r.id}" tabindex="0">${sch.cols.map(c=>{

        else if (f.t === "area") inp = `<textarea id="${idf}" name="${f.k}">${esc(v)}</textarea>`;
        else if (f.t === "chk") return `<div class="fld chk"><input type="checkbox" id="${idf}" name="${f.k}" ${v?"checked":""}><label for="${idf}">${esc(f.l)}</label></div>`;
        else inp = `<input id="${idf}" name="${f.k}" type="${f.t==="num"?"number":f.t==="date"?"date":f.t==="time"?"time":"text"}" ${f.t==="num"?`step="${f.step||"any"}" inputmode="decimal"`:""} value="${esc(v)}">`;

      <button type="submit" class="btn primary">Guardar</button>
    </footer></form>`;
  dlg.dataset.t = t; dlg.dataset.id = id || "";

function submitForm(e){
  e.preventDefault();
  const dlg = $("#dlg"), t = dlg.dataset.t, id = dlg.dataset.id, sch = S[t], fm = e.target;
  const rec = id ? {...DB[t].find(x=>x.id===id)} : {id: uid()};
  delete rec._demo;
  const faltan = [];
  for (const f of sch.fields) {
    if (f.hide) continue;
    const el = fm.elements[f.k];
    let v = f.t === "chk" ? el.checked : el.value.trim();
    if (f.t === "num" && v !== "") v = Number(v);
    rec[f.k] = v;
    if (f.req && (v === "" || v == null)) { faltan.push(f.l); el.style.borderColor = "var(--crit)"; } else if (el.style) el.style.borderColor = "";
  }
  if (faltan.length) { toast(`Falta: ${faltan.join(", ")}`); return; }
  for (const f of FORM_EXTRA) try { f.collect?.(t, rec); } catch(e) { console.warn(e); }
  rec._u = now();
  if (id) DB[t] = DB[t].map(x => x.id===id ? rec : x); else DB[t].push(rec);
  // Coherencia: un movimiento de baja actualiza el animal si coincide el crotal
  if (t === "animales" && rec.estado === "Baja" && !rec.baja) rec.baja = today();
  save(); dlg.close(); render(); toast(id ? "Cambios guardados" : `${sch.one[0].toUpperCase()+sch.one.slice(1)} añadido`);
}

/* ---- Exportar / importar ---- */
function download(name, content, type){
  try { const a = document.createElement("a"); a.href = URL.createObjectURL(new Blob([content], {type})); a.download = name; document.body.appendChild(a); a.click(); setTimeout(()=>{URL.revokeObjectURL(a.href); a.remove();}, 500); } catch(e) { toast("No se pudo descargar el archivo en este navegador."); }
}
function csv(t){
  const sch = S[t], rows = filtered(t);
  const cols = sch.fields.map(f=>f.k);
  const head = sch.fields.map(f=>f.l);
  const cell = v => { const s = String(v ?? ""); return /[;"\n]/.test(s) ? `"${s.replace(/"/g,'""')}"` : s; };
  const lines = [head.map(cell).join(";")].concat(rows.map(r => sch.fields.map(f => {
    const v = r[f.k];
    if (f.t==="ref") return cell(refName(f.ref, v));
    if (f.t==="date") return cell(fdate(v));
    if (f.t==="num") return cell(v===""||v==null?"":String(v).replace(".",","));
    if (f.t==="chk") return v?"Sí":"No";
    return cell(v);
  }).join(";")));
  download(`${t}-${today()}.csv`, "﻿" + lines.join("\r\n"), "text/csv;charset=utf-8");
}

/* ============ Almacén: productos, compras y consumos ============ */
const TIPOS_PROD = ["Fitosanitario","Abono","Semilla","Pienso","Medicamento veterinario","Medicamento apícola","Alimento apícola","Combustible","Otro"];
S.productos = {title: "Productos", one: "producto", label: r => r.nombre, help: "El stock se calcula con las compras y con lo que gastas en cada tratamiento, abonado o alimentación.", fields: [
  {k:"nombre", l:"Nombre comercial", req:1}, {k:"tipo", l:"Tipo", t:"sel", o:TIPOS_PROD, req:1},
  {k:"registro", l:"Nº de registro"}, {k:"materia", l:"Materia activa o composición"},
  {k:"unidad", l:"Unidad de stock", t:"sel", o:["L","kg","ud","dosis","tiras","sacos"], def:"L"},
  {k:"stock_ini", l:"Stock inicial", t:"num", def:0}, {k:"stock_min", l:"Stock mínimo (aviso)", t:"num"},
  {k:"precio", l:"Precio por unidad (€)", t:"num", step:"0.01", help:"Se usa para calcular costes. Si registras compras, se usa el precio medio de las compras."},
  {k:"lote", l:"Lote actual"}, {k:"caducidad", l:"Caducidad", t:"date"},
  {k:"plazo", l:"Plazo de seguridad o tiempo de espera (días)", t:"num"}, {k:"proveedor", l:"Proveedor"},
  {k:"notas", l:"Notas", t:"area"}],
  cols: ["nombre","tipo","registro",
    {l:"Stock", f:r=>`${fnum(stock(r.id))} ${r.unidad||""}`, num:1, pill:r=> r.stock_min!==""&&r.stock_min!=null&&stock(r.id)<=Number(r.stock_min) ? "crit" : ""},
    {l:"Precio medio", f:r=>{const p=precioMedio(r.id);return p?eur.format(p):"";}, num:1},
    {l:"Valor en almacén", f:r=>{const p=precioMedio(r.id);return p?eur.format(Math.max(0,stock(r.id))*p):"";}, num:1},
    "lote", {l:"Caducidad", f:r=>fdate(r.caducidad), pill:r=> !r.caducidad?"": r.caducidad<today()?"crit": daysBetween(today(),r.caducidad)<=60?"warn":"ok"}]};
S.compras = {title: "Compras", one: "compra", label: r => `${refName("productos", r.producto)} ${fdate(r.fecha)}`, fields: [
  {k:"fecha", l:"Fecha", t:"date", req:1, def:today}, {k:"producto", l:"Producto", t:"ref", ref:"productos", req:1},
  {k:"cantidad", l:"Cantidad", t:"num", req:1}, {k:"importe", l:"Importe total (€)", t:"num", step:"0.01"},
  {k:"lote", l:"Lote"}, {k:"caducidad", l:"Caducidad del lote", t:"date"}, {k:"proveedor", l:"Proveedor"},
  {k:"factura", l:"Factura o albarán"}, {k:"gasto", l:"Apuntar también como gasto en Economía", t:"chk", def:true}, {k:"notas", l:"Notas", t:"area"}],
  cols: ["fecha","producto",{l:"Cantidad", f:r=>`${fnum(r.cantidad)} ${DB.productos.find(p=>p.id===r.producto)?.unidad||""}`, num:1},
    {l:"Importe", f:r=>r.importe?eur.format(r.importe):"", num:1},{l:"€/unidad", f:r=>r.importe&&r.cantidad?eur.format(r.importe/r.cantidad):"", num:1},"lote","caducidad","proveedor","factura"]};

/* Tablas que gastan producto del almacén: campo de producto que se rellena y tipos sugeridos */
const CONSUMO = {
  fitosanitarios: {tipos:["Fitosanitario"], fill:{producto:"nombre", registro:"registro", materia:"materia", plazo:"plazo"}},
  abonados: {tipos:["Abono"], fill:{producto:"nombre"}},
  veterinarios: {tipos:["Medicamento veterinario"], fill:{medicamento:"nombre", lote_med:"lote", sup_carne:"plazo"}},
  apitratamientos: {tipos:["Medicamento apícola"], fill:{producto:"nombre", registro:"registro", lote:"lote"}},
  alimentacion: {tipos:["Alimento apícola","Pienso"], fill:{}},
  labores: {tipos:["Semilla","Combustible","Otro"], fill:{}},
};
for (const [t, c] of Object.entries(CONSUMO)) {
  const i = S[t].fields.findIndex(f=>f.t==="area");
  S[t].fields.splice(i < 0 ? S[t].fields.length : i, 0,
    {k:"prod", l:"Producto del almacén", t:"ref", ref:"productos", help:"Opcional. Descuenta del stock y calcula el coste.", filter:p=>c.tipos.includes(p.tipo)||!c.tipos.length},
    {k:"consumo", l:"Cantidad gastada del almacén", t:"num", help:"En la unidad del producto (L, kg, ud...)"});
}
function consumos(pid){ let s = 0; for (const t in CONSUMO) for (const r of DB[t]) if (r.prod===pid) s += Number(r.consumo||0); return s; }
function stock(pid){ const p = DB.productos.find(x=>x.id===pid); if (!p) return 0; return Number(p.stock_ini||0) + DB.compras.filter(c=>c.producto===pid).reduce((s,c)=>s+Number(c.cantidad||0),0) - consumos(pid); }
function precioMedio(pid){
  const cs = DB.compras.filter(c=>c.producto===pid && c.importe && c.cantidad);
  const q = cs.reduce((s,c)=>s+Number(c.cantidad),0);
  if (q) return cs.reduce((s,c)=>s+Number(c.importe),0)/q;
  return Number(DB.productos.find(x=>x.id===pid)?.precio||0);
}
/* Coste de producto de un registro */
const costeConsumo = r => r.prod && r.consumo ? Number(r.consumo) * precioMedio(r.prod) : 0;

/* Al elegir un producto en el formulario, rellena nombre, registro, plazo... si están vacíos */
FORM_EXTRA.push({
  html: () => "",
  mount(t){
    const c = CONSUMO[t]; if (!c) return;
    const sel = $("#f_prod"); if (!sel) return;
    // Ordena: primero los tipos sugeridos
    const f = S[t].fields.find(x=>x.k==="prod");
    [...sel.options].forEach(o => { const p = DB.productos.find(x=>x.id===o.value); if (p && !f.filter(p)) o.textContent += ` (${p.tipo.toLowerCase()})`; });
    sel.addEventListener("change", () => {
      const p = DB.productos.find(x=>x.id===sel.value); if (!p) return;
      for (const [k, src] of Object.entries(c.fill)) { const el = $(`#f_${k}`); if (el && !el.value && p[src]!=null && p[src]!=="") el.value = p[src]; }
      const lab = $('label[for="f_consumo"]'); if (lab) lab.textContent = `Cantidad gastada del almacén (${p.unidad||"ud"}) · quedan ${fnum(stock(p.id))}`;
    });
  },
  collect(t, rec){
    // Una compra marcada como gasto crea o actualiza su apunte en Economía
    if (t !== "compras") return;
    const ex = DB.economia.find(e=>e.compra===rec.id);
    if (rec.gasto && rec.importe) {
      const p = DB.productos.find(x=>x.id===rec.producto);
      const cat = {Fitosanitario:"Fitosanitarios", Abono:"Abonos", Semilla:"Semillas y plantas", Pienso:"Piensos", "Medicamento veterinario":"Veterinario", "Medicamento apícola":"Veterinario", "Alimento apícola":"Piensos", Combustible:"Combustible"}[p?.tipo] || "Otros";
      const mod = {Fitosanitario:"Agrícola", Abono:"Agrícola", Semilla:"Agrícola", Pienso:"Ganadero", "Medicamento veterinario":"Ganadero", "Medicamento apícola":"Apícola", "Alimento apícola":"Apícola"}[p?.tipo] || "General";
      const e = {...(ex||{id:uid()}), fecha:rec.fecha, tipo:"Gasto", modulo:mod, categoria:cat, concepto:`Compra: ${p?.nombre||""}${rec.factura?" ("+rec.factura+")":""}`, importe:Number(rec.importe), compra:rec.id, _u:now()};
      if (ex) DB.economia = DB.economia.map(x=>x.id===ex.id?e:x); else DB.economia.push(e);
    } else if (ex) { DB.economia = DB.economia.filter(x=>x!==ex); tomb(ex.id); }
    // El lote y la caducidad de la última compra pasan al producto
    const p = DB.productos.find(x=>x.id===rec.producto);
    if (p && (rec.lote || rec.caducidad)) { if (rec.lote) p.lote = rec.lote; if (rec.caducidad) p.caducidad = rec.caducidad; p._u = now(); }
  },
  remove(t, rec){ if (t==="compras" && rec) { const ex = DB.economia.find(e=>e.compra===rec.id); if (ex) { DB.economia = DB.economia.filter(x=>x!==ex); tomb(ex.id); } } }
});

/* ============ Rentabilidad por parcela, lote y apiario ============ */
const enAno = r => UI.year === "todos" || (r.fecha||"").startsWith(UI.year);
function rentParcelas(){
  return DB.parcelas.map(p => {
    const ha = Number(p.superficie||0);
    const venta = DB.cosechas.filter(r=>r.parcela===p.id&&enAno(r)).reduce((s,r)=>s+Number(r.cantidad||0)*Number(r.precio||0),0);
    const kg = DB.cosechas.filter(r=>r.parcela===p.id&&enAno(r)).reduce((s,r)=>s+Number(r.cantidad||0),0);
    const ingE = DB.economia.filter(r=>r.parcela===p.id&&r.tipo==="Ingreso"&&enAno(r)).reduce((s,r)=>s+Number(r.importe||0),0);
    const labores = DB.labores.filter(r=>r.parcela===p.id&&enAno(r)).reduce((s,r)=>s+Number(r.coste||0)+costeConsumo(r),0);
    const insumos = [...DB.fitosanitarios, ...DB.abonados].filter(r=>r.parcela===p.id&&enAno(r)).reduce((s,r)=>s+costeConsumo(r),0);
    const gasE = DB.economia.filter(r=>r.parcela===p.id&&r.tipo==="Gasto"&&enAno(r)&&!r.compra).reduce((s,r)=>s+Number(r.importe||0),0);
    const ing = venta + ingE, gas = labores + insumos + gasE;
    return {n:p.nombre, sub:`${fnum(ha)} ha`, ha, kg, ing, gas, det:{"Cosechas":venta, "Otros ingresos":ingE, "Labores":labores, "Productos":insumos, "Otros gastos":gasE}};
  });
}
function rentLotes(){
  const lotes = [...new Set([...DB.animales.map(a=>a.lote), ...DB.economia.map(e=>e.lote)].filter(Boolean))];
  return lotes.map(l => {
    const n = DB.animales.filter(a=>a.lote===l&&a.estado!=="Baja").length;
    const ing = DB.economia.filter(r=>r.lote===l&&r.tipo==="Ingreso"&&enAno(r)).reduce((s,r)=>s+Number(r.importe||0),0);
    const vet = DB.veterinarios.filter(r=>enAno(r)&&(r.animal===l||DB.animales.some(a=>a.lote===l&&a.crotal===r.animal))).reduce((s,r)=>s+costeConsumo(r),0);
    const gasE = DB.economia.filter(r=>r.lote===l&&r.tipo==="Gasto"&&enAno(r)&&!r.compra).reduce((s,r)=>s+Number(r.importe||0),0);
    return {n:l, sub:`${n} animales activos`, cab:n, ing, gas:vet+gasE, det:{"Ventas y otros ingresos":ing, "Medicamentos":vet, "Otros gastos":gasE}};
  });
}
function rentApiarios(){
  return DB.apiarios.map(a => {
    const nc = DB.colmenas.filter(c=>c.apiario===a.id&&c.estado!=="Muerta"&&c.estado!=="Vendida").length;
    const prod = DB.producciones.filter(r=>r.apiario===a.id&&enAno(r));
    const venta = prod.reduce((s,r)=>s+Number(r.kg||0)*Number(r.precio||0),0);
    const ingE = DB.economia.filter(r=>r.apiario===a.id&&r.tipo==="Ingreso"&&enAno(r)).reduce((s,r)=>s+Number(r.importe||0),0);
    const trat = DB.apitratamientos.filter(r=>r.apiario===a.id&&enAno(r)).reduce((s,r)=>s+costeConsumo(r),0);
    const alim = DB.alimentacion.filter(r=>r.apiario===a.id&&enAno(r)).reduce((s,r)=>s+costeConsumo(r),0);
    const gasE = DB.economia.filter(r=>r.apiario===a.id&&r.tipo==="Gasto"&&enAno(r)&&!r.compra).reduce((s,r)=>s+Number(r.importe||0),0);
    // Si la venta de la miel ya está en Economía, no se cuenta dos veces: se usa el mayor de los dos
    const ing = Math.max(venta, ingE);
    return {n:a.nombre, sub:`${nc} colmenas · ${fnum(prod.reduce((s,r)=>s+Number(r.kg||0),0))} kg`, cab:nc, ing, gas:trat+alim+gasE, det:{"Producción valorada":venta, "Ingresos apuntados":ingE, "Tratamientos":trat, "Alimentación":alim, "Otros gastos":gasE}};
  });
}
function tablaRent(title, rows, unit, unitKey){

function sumPeriod(d, p, k=1){ const x = new Date(d+"T12:00:00"); if (p.endsWith("d")) x.setDate(x.getDate()+parseInt(p)*k); else x.setMonth(x.getMonth()+parseInt(p)*k); return x.toISOString().slice(0,10); }
/* Próxima fecha pendiente: para los que se repiten, "hecho" avanza la fecha al guardar */
function proxima(r){ if (r.hecho && !REPET[r.repetir]) return ""; return r.fecha; }
/* Fechas de un recordatorio dentro de un rango */
function ocurrencias(r, desde, hasta){
  const out = []; const p = REPET[r.repetir];
  if (r.hecho && !p) return out;
  let d = r.fecha, i = 0;
  while (d && d <= hasta && i < 400) { if (d >= desde) out.push(d); if (!p) break; i++; d = sumPeriod(r.fecha, p, i); }
  return out;
}

  for (const p of DB.productos||[]) if (p.caducidad && inR(p.caducidad)) E.push({d:p.caducidad, c:"var(--alm)", t:`Caduca ${p.nombre}`, go:["alm","productos"]});

function notifState(){ if (!("Notification" in window)) return "Notificaciones no disponibles"; return Notification.permission === "granted" ? "Notificaciones activadas" : "Activar notificaciones"; }
async function activarNotif(){
  if (!("Notification" in window)) return toast("Este navegador no permite notificaciones. Usa «Añadir al calendario del móvil».");
  try { const p = await Notification.requestPermission(); toast(p === "granted" ? "Notificaciones activadas" : "No se han permitido las notificaciones"); } catch(e) { toast("Este navegador no permite notificaciones aquí."); }
  render(); comprobarAvisos();
}
async function notificar(titulo, cuerpo, tag){
  try { const reg = await navigator.serviceWorker?.getRegistration(); if (reg) return reg.showNotification(titulo, {body:cuerpo, tag, icon:"icon.svg", badge:"icon.svg"}); } catch(e) {}
  try { new Notification(titulo, {body:cuerpo, tag}); } catch(e) {}
}
function comprobarAvisos(){
  if (!("Notification" in window) || Notification.permission !== "granted") return;
  let sent = {}; try { sent = JSON.parse(localStorage.getItem("mi-explotacion-notif")||"{}"); } catch(e) {}
  const h = today(), hora = new Date().toTimeString().slice(0,5);
  for (const a of alertas()) {
    if (a.lv !== "crit" && a.lv !== "warn") continue;
    const key = `${a.t}|${a.d}|${h}`; if (sent[key]) continue;
    const r = DB.recordatorios.find(x=>x.titulo===a.t && proxima(x)===a.d);
    if (r && r.fecha === h && r.hora && r.hora > hora) continue;
    notificar(a.t, a.s, key); sent[key] = 1;
  }
  for (const k in sent) if (!k.endsWith(h)) delete sent[k];
  try { localStorage.setItem("mi-explotacion-notif", JSON.stringify(sent)); } catch(e) {}
}

/* ---- Exportación .ics: el calendario del móvil avisa aunque la app esté cerrada ---- */
function icsExport(){
  const z = s => String(s||"").replace(/[\\;,]/g, m=>"\\"+m).replace(/\n/g,"\\n");
  const dt = (d, h) => d.replace(/-/g,"") + "T" + (h||"09:00").replace(":","") + "00";
  const rr = {"7d":"FREQ=WEEKLY", "1m":"FREQ=MONTHLY", "3m":"FREQ=MONTHLY;INTERVAL=3", "6m":"FREQ=MONTHLY;INTERVAL=6", "12m":"FREQ=YEARLY"};
  const L = ["BEGIN:VCALENDAR","VERSION:2.0","PRODID:-//Mi Explotacion//ES","CALSCALE:GREGORIAN","X-WR-CALNAME:Mi Explotación"];
  const stamp = new Date().toISOString().replace(/[-:]/g,"").slice(0,15)+"Z";
  for (const r of DB.recordatorios) { if (!proxima(r)) continue; const h = r.hora||"09:00"; const end = `${String(Math.min(23, Number(h.slice(0,2))+1)).padStart(2,"0")}:${h.slice(3)}`;
    L.push("BEGIN:VEVENT", `UID:${r.id}@mi-explotacion`, `DTSTAMP:${stamp}`, `DTSTART:${dt(proxima(r), h)}`, `DTEND:${dt(proxima(r), end)}`, `SUMMARY:${z(r.titulo)}`, `DESCRIPTION:${z([r.tipo, r.notas].filter(Boolean).join(" · "))}`);
    if (REPET[r.repetir]) L.push(`RRULE:${rr[REPET[r.repetir]]}`);
    L.push("BEGIN:VALARM","ACTION:DISPLAY",`DESCRIPTION:${z(r.titulo)}`,`TRIGGER:-P${Math.max(0, Number(r.antes||0))}D`,"END:VALARM","END:VEVENT"); }
  // Fin de plazos y retiradas futuras como eventos de día completo
  for (const e of eventosAuto(today(), addDays(today(), 365))) if (!e.done) L.push("BEGIN:VEVENT", `UID:${e.d}-${z(e.t).slice(0,40).replace(/\W/g,"")}@mi-explotacion`, `DTSTAMP:${stamp}`, `DTSTART;VALUE=DATE:${e.d.replace(/-/g,"")}`, `SUMMARY:${z(e.t)}`, "END:VEVENT");
  L.push("END:VCALENDAR");
  download(`mi-explotacion-agenda.ics`, L.join("\r\n"), "text/calendar");
  toast("Abre el archivo descargado para añadirlo a tu calendario");
}

async function comprimir(file){
  try {

  }
  if (k === "economico") {
    const prev = UI.year; UI.year = UI.repY;

    tabla("Gastos e ingresos", ["Fecha","Tipo","Actividad","Categoría","Concepto","Importe"], eco.map(r=>[fdate(r.fecha), r.tipo, r.modulo||"", r.categoria||"", r.concepto, eur.format((r.tipo==="Gasto"?-1:1)*Number(r.importe||0))]), {columnStyles:{5:{halign:"right"}}});
    const ing = eco.filter(r=>r.tipo==="Ingreso").reduce((s,r)=>s+Number(r.importe||0),0), gas = eco.filter(r=>r.tipo==="Gasto").reduce((s,r)=>s+Number(r.importe||0),0);
    tabla("Resumen", ["Ingresos","Gastos","Resultado"], [[eur.format(ing), eur.format(gas), eur.format(ing-gas)]]);
    for (const [tt, rows, u, uk] of [["Rentabilidad por parcela", rentParcelas(), "€/ha", "ha"], ["Rentabilidad por lote de ganado", rentLotes(), "€/cabeza", "cab"], ["Rentabilidad por apiario", rentApiarios(), "€/colmena", "cab"]])
      tabla(tt, ["", "Ingresos", "Costes", "Margen", `Margen ${u}`], rows.map(r=>[`${r.n} (${r.sub})`, eur.format(r.ing), eur.format(r.gas), eur.format(r.ing-r.gas), r[uk]?eur.format((r.ing-r.gas)/r[uk]):"—"]));
    UI.year = prev;
  }
  if (k === "almacen") {
    tabla("Existencias", ["Producto","Tipo","Nº registro","Stock","Unidad","Precio medio","Valor","Lote","Caducidad"], DB.productos.map(p=>{const pm=precioMedio(p.id), s=stock(p.id);return [p.nombre, p.tipo, p.registro||"", fnum(s), p.unidad||"", pm?eur.format(pm):"", pm?eur.format(Math.max(0,s)*pm):"", p.lote||"", fdate(p.caducidad)];}));
    tabla("Compras del año", ["Fecha","Producto","Cantidad","Importe","Lote","Caducidad","Proveedor","Factura"], DB.compras.filter(c=>(c.fecha||"").startsWith(UI.repY)).map(c=>[fdate(c.fecha), refName("productos",c.producto), fnum(c.cantidad), c.importe?eur.format(c.importe):"", c.lote||"", fdate(c.caducidad), c.proveedor||"", c.factura||""]));
  }
  // Pie con número de página y firma
  const n = doc.getNumberOfPages();
  if (y > 175) { doc.addPage(); y = 20; }

  for (let i=1;i<=doc.getNumberOfPages();i++){ doc.setPage(i); doc.setFontSize(8); doc.setTextColor(120); doc.text([R.t, T.nombre, `Página ${i} de ${doc.getNumberOfPages()}`].filter(Boolean).join(" · "), W-14, 203, {align:"right"}); }
  const name = `${k}-${UI.repY}.pdf`;
  try { doc.save(name); toast("PDF descargado"); } catch(e) { toast("No se pudo descargar el PDF en este navegador"); }
}
document.addEventListener("click", e => { const el = e.target.closest('[data-act="pdf"]'); if (el) generarPDF(el.dataset.k); });
document.addEventListener("change", e => { if (e.target.id === "repY") { UI.repY = e.target.value; render(); } });

/* ============ Guiado GPS en paralelo (líneas AB) ============ */
S.lineas = {title: "Líneas AB", one: "línea AB", label: r => r.nombre, fields: [
  {k:"nombre", l:"Nombre", req:1}, {k:"parcela", l:"Parcela", t:"ref", ref:"parcelas"}, {k:"ancho", l:"Ancho de trabajo (m)", t:"num", req:1},
  {k:"a", l:"Punto A", hide:1}, {k:"b", l:"Punto B", hide:1}], cols:["nombre","parcela","ancho"]};

const G = {A:null, B:null, ancho:12, parcela:"", gps:null, sim:false, simT:null, run:false, aplicando:false,
  pos:null, prev:null, hdg:0, vel:0, acc:null, t0:null, track:[], cells:new Set(), bruto:0, zoom:3, follow:true, pasadas:new Set(), wake:null, lineaId:""};
try { const s = JSON.parse(localStorage.getItem("mi-explotacion-guiado")||"null"); if (s) Object.assign(G, {ancho:s.ancho||12, parcela:s.parcela||"", A:s.A||null, B:s.B||null, lineaId:s.lineaId||""}); } catch(e) {}
const gSave = () => { try { localStorage.setItem("mi-explotacion-guiado", JSON.stringify({ancho:G.ancho, parcela:G.parcela, A:G.A, B:G.B, lineaId:G.lineaId})); } catch(e) {} };

/* Proyección local en metros alrededor del punto A */
const R0 = 6378137;
function toXY(lat, lng){ const o = G.A || G.pos?.ll || [lat, lng]; return [(lng-o[1])*Math.PI/180*R0*Math.cos(o[0]*Math.PI/180), (lat-o[0])*Math.PI/180*R0]; }
function toLL(x, y){ const o = G.A; return [o[0] + y/R0*180/Math.PI, o[1] + x/(R0*Math.cos(o[0]*Math.PI/180))*180/Math.PI]; }
function ejes(){ if (!G.A || !G.B) return null; const b = toXY(...G.B); const L = Math.hypot(b[0], b[1]); if (L < 1) return null; const u = [b[0]/L, b[1]/L]; return {u, n:[-u[1], u[0]], L}; }
/* Desvío respecto a la pasada más cercana: k = número de pasada, e = metros a la izquierda de esa línea */
function desvio(p){ const E = ejes(); if (!E || !p) return null; const d = p[0]*E.n[0] + p[1]*E.n[1]; const k = Math.round(d / G.ancho); const s = p[0]*E.u[0] + p[1]*E.u[1]; return {k, e: d - k*G.ancho, s, E}; }

/* Cobertura: celdas de ancho/4 marcadas a lo largo de cada tramo aplicado */
const celda = () => Math.max(0.5, G.ancho/4);
function cubrir(p, q){
  const dx = q[0]-p[0], dy = q[1]-p[1], L = Math.hypot(dx, dy); if (L < 0.05 || L > 60) return;
  G.bruto += L * G.ancho;
  const c = celda(), ux = dx/L, uy = dy/L, nx = -uy, ny = ux;
  for (let s = 0; s <= L; s += c/2) for (let w = -G.ancho/2 + c/2; w <= G.ancho/2; w += c/2) {
    const x = p[0] + ux*s + nx*w, y = p[1] + uy*s + ny*w; G.cells.add(`${Math.floor(x/c)},${Math.floor(y/c)}`);
  }
}
const haCubiertas = () => G.cells.size * celda()**2 / 10000;

function nuevaPos(lat, lng, acc, vel){
  const p = toXY(lat, lng);
  if (G.pos) {
    const d = Math.hypot(p[0]-G.pos.xy[0], p[1]-G.pos.xy[1]);
    if (d > 0.8) { G.hdg = Math.atan2(p[0]-G.pos.xy[0], p[1]-G.pos.xy[1]); if (G.aplicando) cubrir(G.pos.xy, p); G.track.push(p); if (G.track.length > 20000) G.track.shift(); }
    else if (d < 0.8 && G.pos) { G.acc = acc; G.vel = vel ?? G.vel; pintar(); return; }
  }
  G.pos = {xy:p, ll:[lat, lng]}; G.acc = acc; if (vel != null) G.vel = vel;
  const dv = desvio(p); if (dv && G.aplicando) G.pasadas.add(dv.k);
  pintar();
}

/* ---- Simulación para probar sin moverse ---- */
function simular(){
  if (!G.A || !G.B) lineaEjemplo();
  const E = ejes(); if (!E) return toast("Marca primero los puntos A y B");
  let k = 0, dir = 1, s = -8, t = 0;
  G.sim = true; G.run = true; G.aplicando = true; G.t0 = Date.now(); G.pos = null; G.track = []; G.cells = new Set(); G.bruto = 0; G.pasadas = new Set();
  clearInterval(G.simT);
  G.simT = setInterval(() => {
    const v = 2.4; t += 0.25; s += dir * v * 0.5; // 8,6 km/h, paso de 0,5 s
    if (s > E.L + 8 || s < -8) { k++; dir = -dir; s = dir > 0 ? -8 : E.L + 8; }
    const ruido = Math.sin(t*0.9)*0.35 + Math.sin(t*2.3)*0.12 + (Math.random()-0.5)*0.08;
    const x = E.u[0]*s + E.n[0]*(k*G.ancho + ruido), y = E.u[1]*s + E.n[1]*(k*G.ancho + ruido);
    const ll = toLL(x, y); nuevaPos(ll[0], ll[1], 1.5, v);
  }, 500);
  render();
}
function lineaEjemplo(){
  const p = DB.parcelas.find(x=>x.id===G.parcela && x.geo?.length>2) || DB.parcelas.find(x=>x.geo?.length>2);
  if (p) { G.parcela = p.id; G.A = p.geo[0]; G.B = p.geo[1]; }
  else { G.A = [39.12, -3.46]; G.B = [39.12, -3.457]; }
  gSave();
}

function startGPS(){
  if (!navigator.geolocation) return toast("Este dispositivo no tiene GPS disponible");
  pararGuiado(true);
  G.run = true; G.t0 = G.t0 || Date.now();
  G.gps = navigator.geolocation.watchPosition(p => nuevaPos(p.coords.latitude, p.coords.longitude, p.coords.accuracy, p.coords.speed), err => { toast(err.code === 1 ? "Permite el acceso a la ubicación para usar el guiado" : "Sin señal GPS"); }, {enableHighAccuracy:true, maximumAge:0, timeout:30000});
  try { navigator.wakeLock?.request("screen").then(w => G.wake = w).catch(()=>{}); } catch(e) {}
  render();
}
function pararGuiado(silencio){
  if (G.gps != null) navigator.geolocation.clearWatch(G.gps); G.gps = null;
  clearInterval(G.simT); G.simT = null; G.sim = false; G.run = false;
  try { G.wake?.release(); } catch(e) {} G.wake = null;
  if (!silencio) render();
}
function marcar(cual){
  const tomar = ll => { if (cual === "A") { G.A = ll; G.track = []; G.cells = new Set(); G.bruto = 0; G.pos = null; } else { G.B = ll; } G.lineaId = ""; gSave(); toast(`Punto ${cual} marcado`); render(); };
  if (G.pos && G.run) return tomar(G.pos.ll);
  if (!navigator.geolocation) return toast("Este dispositivo no tiene GPS disponible");
  toast("Buscando posición…");
  navigator.geolocation.getCurrentPosition(p => tomar([p.coords.latitude, p.coords.longitude]), () => toast("No se pudo obtener la posición"), {enableHighAccuracy:true, timeout:30000});
}
function rumbo(){
  const v = Number(($("#gRumbo")?.value || "").replace(",", "."));
  if (!G.A) return toast("Marca primero el punto A");
  if (isNaN(v)) return toast("Escribe el rumbo en grados (0 = norte, 90 = este)");
  const r = v*Math.PI/180; G.B = toLL(Math.sin(r)*200, Math.cos(r)*200); G.lineaId = ""; gSave(); toast(`Línea a ${v}° creada`); render();
}

/* ---- Dibujo ---- */
function pintar(){
  const cv = $("#gCanvas"); if (!cv) return;
  const dpr = window.devicePixelRatio || 1, w = cv.clientWidth, h = cv.clientHeight;
  if (cv.width !== Math.round(w*dpr)) { cv.width = Math.round(w*dpr); cv.height = Math.round(h*dpr); }
  const c = cv.getContext("2d"); c.setTransform(dpr,0,0,dpr,0,0);
  const css = getComputedStyle(document.documentElement), col = n => css.getPropertyValue(n).trim();
  c.fillStyle = col("--g-bg"); c.fillRect(0,0,w,h);
  const sc = G.zoom; const ctr = G.pos?.xy || [0,0];
  const P = (x, y) => [w/2 + (x-ctr[0])*sc, h*0.62 - (y-ctr[1])*sc];
  // Parcela
  const parc = DB.parcelas.find(p=>p.id===G.parcela);
  if (parc?.geo?.length > 2 && G.A) { c.beginPath(); parc.geo.forEach((q,i)=>{ const [x,y] = P(...toXY(q[0],q[1])); i?c.lineTo(x,y):c.moveTo(x,y); }); c.closePath(); c.fillStyle = col("--g-field"); c.fill(); c.strokeStyle = col("--g-edge"); c.lineWidth = 2; c.stroke(); }
  // Cobertura
  const cs = celda(); c.fillStyle = col("--g-cov");
  for (const k of G.cells) { const [i,j] = k.split(",").map(Number); const [x,y] = P(i*cs, (j+1)*cs); c.fillRect(x, y, cs*sc+0.6, cs*sc+0.6); }
  // Líneas guía
  const E = ejes(), dv = desvio(G.pos?.xy || [0,0]);
  if (E) {
    const span = Math.hypot(w, h)/sc, k0 = dv ? dv.k : 0, s0 = dv ? dv.s : 0, nVis = Math.ceil(span/G.ancho/2)+1;
    for (let k = k0-nVis; k <= k0+nVis; k++) {
      const ox = E.n[0]*k*G.ancho, oy = E.n[1]*k*G.ancho;
      const [x1,y1] = P(ox + E.u[0]*(s0-span), oy + E.u[1]*(s0-span)), [x2,y2] = P(ox + E.u[0]*(s0+span), oy + E.u[1]*(s0+span));
      c.beginPath(); c.moveTo(x1,y1); c.lineTo(x2,y2);
      c.strokeStyle = k === k0 ? col("--g-line-on") : col("--g-line"); c.lineWidth = k === k0 ? 3 : 1.2; c.setLineDash(k === k0 ? [] : [8,6]); c.stroke(); c.setLineDash([]);
    }
    for (const [lbl, ll] of [["A", G.A], ["B", G.B]]) { const [x,y] = P(...toXY(ll[0], ll[1])); c.fillStyle = col("--g-line-on"); c.beginPath(); c.arc(x,y,9,0,7); c.fill(); c.fillStyle = col("--g-bg"); c.font = "bold 11px system-ui"; c.textAlign = "center"; c.textBaseline = "middle"; c.fillText(lbl, x, y+0.5); }
  }
  // Rastro
  if (G.track.length > 1) { c.beginPath(); G.track.forEach((q,i)=>{ const [x,y] = P(q[0],q[1]); i?c.lineTo(x,y):c.moveTo(x,y); }); c.strokeStyle = col("--g-track"); c.lineWidth = 1.5; c.stroke(); }
  // Vehículo y apero
  if (G.pos) {
    const [x,y] = P(...G.pos.xy); c.save(); c.translate(x,y); c.rotate(G.hdg);
    c.fillStyle = G.aplicando ? col("--g-cov-on") : "rgba(128,128,128,.35)"; c.fillRect(-G.ancho/2*sc, 4, G.ancho*sc, 6);
    c.fillStyle = col("--g-car"); c.beginPath(); c.moveTo(0,-16); c.lineTo(10,12); c.lineTo(0,7); c.lineTo(-10,12); c.closePath(); c.fill(); c.strokeStyle = col("--g-bg"); c.lineWidth = 2; c.stroke(); c.restore();
  } else { c.fillStyle = col("--g-muted"); c.font = "15px system-ui"; c.textAlign = "center"; c.fillText(G.run ? "Esperando señal GPS…" : "Pulsa «Empezar» o «Probar en simulación»", w/2, h/2); }
  // Escala
  const m = [1,2,5,10,20,50,100,200].find(v => v*sc > 60) || 200; c.fillStyle = col("--g-muted"); c.fillRect(12, h-18, m*sc, 3); c.font = "11px system-ui"; c.textAlign = "left"; c.fillText(`${m} m`, 12, h-24);
  barra(dv);
}
function barra(dv){
  const bar = $("#gBar"); if (!bar) return;
  let txt = "—", cls = "", leds = Array(15).fill("");
  if (dv && G.pos) {
    const sentido = Math.sin(G.hdg)*dv.E.u[0] + Math.cos(G.hdg)*dv.E.u[1] >= 0 ? 1 : -1;
    const izq = dv.e * sentido; // metros a la izquierda de la línea, según el avance
    const cm = Math.round(Math.abs(izq)*100), paso = 0.08;
    // Las luces se encienden en el lado hacia el que te has desviado
    const m = Math.max(-7, Math.min(7, Math.round(izq/paso)));
    leds = Array.from({length:15}, (_, i) => { const j = i - 7; if (j === 0) return "c"; const on = (m > 0 && j < 0 && -j <= m) || (m < 0 && j > 0 && j <= -m); return on ? (Math.abs(j) > 4 ? "r" : "a") : ""; });
    txt = cm <= 10 ? `En línea · ${cm} cm` : izq > 0 ? `${cm} cm · gira a la derecha ▶` : `◀ gira a la izquierda · ${cm} cm`;
    cls = cm <= 10 ? "ok" : cm <= 40 ? "warn" : "crit";
  }
  bar.innerHTML = `<div class="g-leds">${leds.map(v=>`<i class="${v}"></i>`).join("")}</div><div class="g-txt ${cls}">${txt}</div>`;
  const st = $("#gStats"); if (!st) return;
  const min = G.t0 ? (Date.now()-G.t0)/60000 : 0, ha = haCubiertas(), solape = G.bruto ? Math.max(0, 1 - ha*10000/G.bruto) : 0;
  st.innerHTML = [["Pasada", dv && G.pos ? (dv.k >= 0 ? dv.k+1 : dv.k) : "—"], ["Velocidad", `${fnum((G.vel||0)*3.6)} km/h`], ["Trabajado", `${fnum(ha)} ha`], ["Solape", `${Math.round(solape*100)} %`], ["Tiempo", `${Math.floor(min/60)}:${String(Math.floor(min%60)).padStart(2,"0")} h`], ["Precisión GPS", G.acc!=null?`±${fnum(G.acc)} m`:"—"]]
    .map(([k,v])=>`<div><span>${k}</span><b ${k==="Precisión GPS"&&G.acc>5?'class="g-bad"':""}>${v}</b></div>`).join("");
}

/* Horas actuales: última lectura del horómetro más las horas de partes posteriores */
function horasMaquina(id){
  const m = DB.maquinaria.find(x=>x.id===id); if (!m) return 0;
  const lect = [...DB.intervenciones, ...(DB.repostajes||[])].filter(i=>i.maquina===id && i.horometro!==""&&i.horometro!=null).sort((a,b)=>(a.fecha||"").localeCompare(b.fecha||"")).pop();
  const partes = (desde) => DB.partes.filter(p=>p.maquina===id && (!desde || p.fecha > desde)).reduce((s,p)=>s+horasMaq(p),0);
  const base = Number(m.horometro||0) + partes(null);
  return lect ? Math.max(base, Number(lect.horometro) + partes(lect.fecha)) : base;
}
function proximaMant(r){
  const h = horasMaquina(r.maquina), out = {txt:"", estado:"Al día", lv:"ok", horas:null, fecha:null, pct:0};
  const partes = [];
  if (r.cada_horas) { const ult = r.ultima_horas!==""&&r.ultima_horas!=null ? Number(r.ultima_horas) : Number(DB.maquinaria.find(m=>m.id===r.maquina)?.horometro||0);
    out.horas = ult + Number(r.cada_horas); const q = out.horas - h; out.pct = Math.max(out.pct, Math.min(1, (h-ult)/Number(r.cada_horas)));
    partes.push(q < 0 ? `pasado ${fnum(-q)} h` : `en ${fnum(q)} h (a las ${fnum(out.horas)} h)`);
    if (q < 0) { out.lv = "crit"; out.estado = "Vencido"; } else if (q <= Number(r.aviso_horas||0) && out.lv !== "crit") { out.lv = "warn"; out.estado = "Toca pronto"; } }
  if (r.cada_meses) { const base = r.ultima_fecha || today();
    const x = new Date(base+"T12:00:00"); x.setMonth(x.getMonth()+Number(r.cada_meses)); out.fecha = x.toISOString().slice(0,10);
    const d = daysBetween(today(), out.fecha); const tot = daysBetween(base, out.fecha) || 1; out.pct = Math.max(out.pct, Math.min(1, 1 - d/tot));
    partes.push(d < 0 ? `venció el ${fdate(out.fecha)}` : `el ${fdate(out.fecha)}`);
    if (d < 0) { out.lv = "crit"; out.estado = "Vencido"; } else if (d <= Number(r.aviso_dias||0) && out.lv !== "crit") { out.lv = "warn"; out.estado = "Toca pronto"; } }
  if (!r.cada_horas && !r.cada_meses) { out.estado = "Sin frecuencia"; out.lv = ""; }
  out.txt = partes.join(" o ");
  return out;
}

function precioL(r){ if (r.precio) return Number(r.precio); if (r.importe && r.litros) return Number(r.importe)/Number(r.litros); if (r.prod) return precioMedio(r.prod); return 0; }
function importeRep(r){ if (r.importe !== "" && r.importe != null) return Number(r.importe); return Number(r.litros||0) * precioL(r); }

/* Tramos entre llenados completos con horómetro: litros repostados después del primero hasta el segundo, entre las horas transcurridas */
function tramos(maqId){
  const R = DB.repostajes.filter(r=>r.maquina===maqId && !/AdBlue/.test(r.combustible||"")).sort((a,b)=>(a.fecha||"").localeCompare(b.fecha||"") || Number(a.horometro||0)-Number(b.horometro||0));
  const T = []; let ini = null, litros = 0;
  for (const r of R) {
    if (ini) litros += Number(r.litros||0);
    if (r.lleno && r.horometro !== "" && r.horometro != null) {
      if (ini) { const horas = Number(r.horometro) - Number(ini.horometro); if (horas > 0) T.push({desde:ini, hasta:r, litros, horas, lh: litros/horas}); }
      ini = r; litros = 0;
    }
  }
  const media = mediaLH(T);
  for (const t of T) t.anomalo = T.length >= 3 && media && t.lh > media * 1.3;
  return T;
}
const mediaLH = T => { const h = T.reduce((s,t)=>s+t.horas,0); return h ? T.reduce((s,t)=>s+t.litros,0)/h : 0; };
function tramoDe(r){ if (!r.lleno) return null; return tramos(r.maquina).find(t=>t.hasta.id===r.id) || null; }
/* Consumo medio de una máquina (l/h): media de los tramos completos */
const lhMaquina = id => mediaLH(tramos(id));

const fiscal = () => ({regimen:"REAGP", serie:"F", ...(DB._meta.fiscal||{})});
const COMP = {"Agrícola":12, "General":12, "Ganadero":10.5, "Apícola":10.5};
function siguienteFactura(){ const y = new Date().getFullYear(), s = fiscal().serie || "F", pre = `${s}-${y}-`; const n = DB.ventas.filter(v=>String(v.numero||"").startsWith(pre)).map(v=>Number(String(v.numero).slice(pre.length))||0); return pre + String((n.length?Math.max(...n):0)+1).padStart(3,"0"); }
function totalesVenta(v){
  let base = 0, imp = 0;
  for (const l of v.lineas||[]) { const b = Number(l.cantidad||0) * Number(l.precio||0); base += b; imp += b * Number(l.pct||0) / 100; }
  base = Math.round(base*100)/100; imp = Math.round(imp*100)/100;
  return {base, imp, total: Math.round((base+imp)*100)/100};
}
const pctDefecto = act => fiscal().regimen === "REAGP" ? COMP[act||"Agrícola"] : (act === "Apícola" ? 10 : 4);

function lotes(){
  const L = [];
  for (const c of DB.cosechas) if (c.albaran) L.push({codigo:c.albaran, tipo:"Cosecha", fecha:c.fecha, producto:c.cultivo, kg:Number(c.cantidad||0), origen:refName("parcelas", c.parcela), ref:["cosechas", c.id], parcela:c.parcela});
  for (const p of DB.producciones) if (p.lote) L.push({codigo:p.lote, tipo:p.producto||"Miel", fecha:p.fecha, producto:`${p.producto||"Miel"}${p.tipo_miel?" de "+p.tipo_miel.toLowerCase():""}`, kg:Number(p.kg||0), origen:refName("apiarios", p.apiario), ref:["producciones", p.id], apiario:p.apiario});
  for (const l of L) { const v = vendidoLote(l.codigo); l.vendido = v; l.queda = l.kg - v; }
  return L.sort((a,b)=>(b.fecha||"").localeCompare(a.fecha||""));
}
function lineasDeLote(cod){ const out = []; for (const v of DB.ventas) for (const l of v.lineas||[]) if (l.lote && l.lote === cod) out.push({v, l}); return out; }

    for (const r of DB.alimentacion.filter(r=>r.apiario===l.apiario && r.fecha>=desde && r.fecha<=l.fecha)) E.push({fecha:r.fecha, tipo:"Alimentación", txt:`${r.tipo} · ${fnum(r.cantidad)} kg`, ok:true});

/* Días trabajados de una persona en un mes: entrada, salida, descanso, horas y extras */
function diasJornada(tid, mes){
  const P = DB.partes.filter(p=>p.trabajador===tid && (p.fecha||"").startsWith(mes));
  const dias = {};
  for (const p of P) { const d = dias[p.fecha] = dias[p.fecha] || {fecha:p.fecha, ent:"", sal:"", desc:0, horas:0, tareas:[], partes:[]};
    if (p.inicio && (!d.ent || p.inicio < d.ent)) d.ent = p.inicio; if (p.fin && (!d.sal || p.fin > d.sal)) d.sal = p.fin;
    d.desc += Number(p.descanso||0); d.horas += horasParte(p); d.tareas.push(p.tarea); d.partes.push(p); }
  const J = jornadaDia();
  return Object.values(dias).sort((a,b)=>a.fecha.localeCompare(b.fecha)).map(d => ({...d, ord:Math.min(d.horas, J), extra:Math.max(0, d.horas - J), tareas:[...new Set(d.tareas)].filter(Boolean)}));
}

/* Censo a una fecha: animales dados de alta y sin baja en ese día, por especie y categoría */
function censoA(f){
  const A = DB.animales.filter(a => (!a.alta || a.alta <= f) && (!a.baja || a.baja > f) && (!a.nacimiento || a.nacimiento <= f));
  const meses = a => a.nacimiento ? daysBetween(a.nacimiento, f)/30.44 : 99;
  const cat = a => { const m = meses(a);
    if (["Ovino","Caprino"].includes(a.especie)) return a.sexo === "Hembra" ? (m >= 12 ? "Hembras reproductoras (12 meses o más)" : "Reposición y corderos/cabritos (menos de 12 meses)") : (m >= 12 ? "Machos reproductores" : "Reposición y corderos/cabritos (menos de 12 meses)");
    if (a.especie === "Vacuno") return m < 12 ? "Menores de 12 meses" : m < 24 ? "De 12 a 24 meses" : a.sexo === "Hembra" ? "Hembras de más de 24 meses" : "Machos de más de 24 meses";
    return a.sexo === "Hembra" ? "Hembras" : "Machos"; };
  const g = {}; for (const a of A) { const k = `${a.especie}|${cat(a)}`; g[k] = (g[k]||0) + 1; }
  return Object.entries(g).map(([k, n]) => { const [especie, c] = k.split("|"); return {especie, cat:c, n}; }).sort((a,b)=>a.especie.localeCompare(b.especie) || a.cat.localeCompare(b.cat));
}

const SR = window.SpeechRecognition || window.webkitSpeechRecognition;

function escuchar(onFinal, onParcial, onFin){
  if (!SR) { toast("Este navegador no permite dictar. Usa Chrome en Android o Safari en iPhone."); return null; }
  if (vozActiva) { try { vozActiva.stop(); } catch(e) {} vozActiva = null; return null; }
  const r = new SR(); r.lang = "es-ES"; r.interimResults = true; r.continuous = false; r.maxAlternatives = 1;
  r.onresult = ev => { let fin = "", par = ""; for (const x of ev.results) (x.isFinal ? (fin += x[0].transcript) : (par += x[0].transcript)); if (par && onParcial) onParcial(par); if (fin) onFinal(fin.trim()); };
  r.onerror = ev => toast(ev.error === "not-allowed" || ev.error === "service-not-allowed" ? "Permite el micrófono para dictar" : ev.error === "no-speech" ? "No se ha oído nada" : ev.error === "network" ? "El dictado necesita conexión a internet" : "No se pudo dictar");
  r.onend = () => { vozActiva = null; onFin && onFin(); };
  try { r.start(); vozActiva = r; } catch(e) { toast("No se pudo usar el micrófono"); return null; }

}

const NUM = {un:1, uno:1, una:1, dos:2, tres:3, cuatro:4, cinco:5, seis:6, siete:7, ocho:8, nueve:9, diez:10, once:11, doce:12, trece:13, catorce:14, quince:15, veinte:20, treinta:30, cuarenta:40, cincuenta:50, media:0.5};
const norm = s => String(s||"").toLowerCase().normalize("NFD").replace(/[̀-ͯ]/g, "");
function numDe(txt){ const t = norm(txt).trim(); if (/^\d+([.,]\d+)?$/.test(t)) return Number(t.replace(",", ".")); let n = 0; for (const w of t.split(/\s+y\s+|\s+/)) if (NUM[w] != null) n += NUM[w]; return n || null; }
const NUMRE = "(\\d+(?:[.,]\\d+)?|(?:un|uno|una|dos|tres|cuatro|cinco|seis|siete|ocho|nueve|diez|once|doce|trece|catorce|quince|veinte|treinta|cuarenta|cincuenta)(?:\\s+y\\s+(?:media|uno|dos|tres|cuatro|cinco|seis|siete|ocho|nueve))?)";
/* Busca el registro cuyo nombre aparece mejor en el texto */
function mejor(lista, nombre, txt){
  let best = null, score = 0; const t = ` ${norm(txt)} `;
  for (const r of lista) { const n = norm(nombre(r)); if (!n) continue;
    if (t.includes(` ${n} `) || t.includes(n)) { if (n.length*2 > score) { best = r; score = n.length*2; } continue; }
    const pal = n.split(/\s+/).filter(w=>w.length>3 && !["parcela","apiario","del","las","los"].includes(w)); const hit = pal.filter(w=>t.includes(` ${w}`)).length;
    if (hit && hit*5 > score) { best = r; score = hit*5; } }
  return best;
}
const TAREA_KEYS = [["Poda", /pod(a|e|ar|ando)/], ["Siembra", /sembr|siembra/], ["Abonado", /abon/], ["Tratamiento fitosanitario", /trat(amiento|ar|e)|sulfat|fumig|pulveriz/], ["Riego", /rieg|regar|regando/], ["Desbroce", /desbro|desbroz/], ["Recolección", /recole|cosech|vendimi|aceitun/], ["Ordeño", /orde[nñ]/], ["Alimentación del ganado", /dar de comer|pienso|alimentar|echar de comer/], ["Manejo del ganado", /ganado|ovejas|cabras|vacas|corderos|pastore|esquil/], ["Limpieza de instalaciones", /limpi/], ["Revisión de colmenas", /colmena|revisar las abejas|revision/], ["Extracción de miel", /miel|extrac|castr/], ["Mantenimiento de maquinaria", /taller|mantenimiento|engras|cambio de aceite|arregl/], ["Transporte", /transport|llevar|acarre/], ["Laboreo", /arar|labor|grada|cultivador|chisel|rotavator|binar/]];
function interpretarParte(txt){
  const t = norm(txt), r = {trabajo: txt.charAt(0).toUpperCase() + txt.slice(1)};
  if (/\bayer\b/.test(t)) r.fecha = addDays(today(), -1); else if (/anteayer|antes de ayer/.test(t)) r.fecha = addDays(today(), -2); else r.fecha = today();
  const w = mejor(DB.trabajadores, x=>x.nombre, txt); if (w) r.trabajador = w.id;
  const p = mejor(DB.parcelas, x=>x.nombre, txt); if (p) { r.parcela = p.id; r.actividad = "Agrícola"; }
  const a = mejor(DB.apiarios, x=>x.nombre, txt); if (a && (!p || /colmen|apiar|abeja|miel/.test(t))) { r.apiario = a.id; r.actividad = "Apícola"; if (!/parcela/.test(t)) delete r.parcela; }
  const m = mejor(DB.maquinaria, x=>`${x.nombre} ${x.tipo||""}`, txt); if (m && /tractor|maquina|pulveriz|abonadora|sembradora|cosechadora|remolque|con el|con la/.test(t)) r.maquina = m.id;
  const lote = [...new Set(DB.animales.map(x=>x.lote).filter(Boolean))].find(l => t.includes(norm(l))); if (lote) { r.lote = lote; r.actividad = "Ganadero"; }
  for (const [tarea, re] of TAREA_KEYS) if (re.test(t)) { r.tarea = tarea; break; }
  if (!r.actividad) r.actividad = /colmen|abeja|miel/.test(t) ? "Apícola" : /ganado|oveja|cabra|vaca|cordero|orden/.test(t) ? "Ganadero" : "Agrícola";
  const rango = t.match(new RegExp(`de(?:sde)?(?: las)? ${NUMRE}(?:[:.](\\d{2}))?(?: y media)? (?:a|hasta)(?: las)? ${NUMRE}(?:[:.](\\d{2}))?(?: y media)?`));
  if (rango) { const hh = (n, mm, media) => { let h = numDe(n); if (h == null) return ""; if (h < 6 && /tarde/.test(t)) h += 12; return `${String(Math.floor(h)).padStart(2,"0")}:${mm || (media || h%1 ? "30" : "00")}`; };
    r.inicio = hh(rango[1], rango[2], /^de(?:sde)?(?: las)? \S+ y media/.test(rango[0])); let fin = numDe(rango[3]); if (fin != null && fin < numDe(rango[1])) fin += 12; r.fin = fin != null ? `${String(Math.floor(fin)).padStart(2,"0")}:${rango[4] || (fin%1 ? "30" : "00")}` : ""; }
  const hs = t.match(new RegExp(`${NUMRE}(?: y media)? horas?`)); if (hs && !rango) { let h = numDe(hs[1]); if (/y media horas?$/.test(hs[0])) h += 0.5; if (h) r.horas = h; }
  if (/media hora/.test(t) && !hs) r.horas = 0.5;
  const ha = t.match(new RegExp(`${NUMRE}(?: y media)? hectareas?`)); if (ha) { let v = numDe(ha[1]); if (/y media hectareas?$/.test(ha[0])) v += 0.5; if (v) r.superficie = v; }
  if (/pendiente|sin terminar|a medias/.test(t)) r.estado = "Pendiente";
  return r;
}
function abrirParteVoz(txt){
  const r = interpretarParte(txt);
  openForm("partes");
  const set = (k, v) => { const f = $(`#f_${k}`); if (f && v != null && v !== "") { f.value = v; f.dispatchEvent(new Event("input", {bubbles:true})); } };
  for (const k of ["fecha","trabajador","tarea","actividad","parcela","apiario","lote","maquina","inicio","fin","horas","superficie","estado","trabajo"]) set(k, r[k]);
  const faltan = [!r.trabajador && "trabajador", !r.tarea && "tarea"].filter(Boolean);
  toast(faltan.length ? `Revisa: falta ${faltan.join(" y ")}` : "Revisa el parte y guarda");
}

async function sbFetch(path, opt={}, auth=true){
  const h = {apikey: SY.key, "Content-Type":"application/json", ...(opt.headers||{})};
  if (auth && SY.session) h.Authorization = `Bearer ${SY.session.access_token}`;
  let r = await fetch(SY.url.replace(/\/$/,"") + path, {...opt, headers:h});
  if (r.status === 401 && auth && SY.session?.refresh_token) {
    await sbAuth("refresh_token", {refresh_token: SY.session.refresh_token});
    h.Authorization = `Bearer ${SY.session.access_token}`;
    r = await fetch(SY.url.replace(/\/$/,"") + path, {...opt, headers:h});
  }
  if (!r.ok) { let m = ""; try { const j = await r.json(); m = j.msg || j.message || j.error_description || j.error || ""; } catch(e) {} throw new Error(m || `Error ${r.status}`); }
  return r.status === 204 ? null : r.json().catch(()=>null);
}
async function sbAuth(grant, body){
  const j = await sbFetch(`/auth/v1/token?grant_type=${grant}`, {method:"POST", body:JSON.stringify(body)}, false);
  SY.session = {access_token:j.access_token, refresh_token:j.refresh_token, user:j.user?.id || SY.session?.user, email:j.user?.email || SY.email}; sySave();
}

/* Mezcla registro a registro: gana la versión editada más tarde; los borrados se respetan */
function mezclar(local, remoto){
  const out = blank();
  const del = {...(remoto._meta?.del||{}), ...(local._meta?.del||{})};
  for (const k in remoto._meta?.del||{}) del[k] = Math.max(del[k]||0, remoto._meta.del[k]);
  for (const t in S) {
    const m = new Map();
    for (const r of remoto[t]||[]) m.set(r.id, r);
    for (const r of local[t]||[]) { const o = m.get(r.id); if (!o || (r._u||0) >= (o._u||0)) m.set(r.id, r); }
    out[t] = [...m.values()].filter(r => !(del[r.id] && del[r.id] >= (r._u||0)));
  }
  const lt = local._meta?.titular_u||0, rt = remoto._meta?.titular_u||0;
  out._meta = {...(remoto._meta||{}), ...(local._meta||{}), del, titular: lt >= rt ? local._meta?.titular||{} : remoto._meta?.titular||{}, titular_u: Math.max(lt, rt)};
  // Los borrados de más de 180 días ya no hacen falta
  const lim = now() - 180*864e5; for (const k in out._meta.del) if (out._meta.del[k] < lim) delete out._meta.del[k];
  return out;
}
async function sincronizar(manual){
  if (!SY.url || !SY.key || !SY.session) { if (manual) toast("Configura la sincronización en Ajustes"); return; }
  if (syBusy) return; if (!navigator.onLine) { syMsg = "Sin conexión. Se sincronizará al volver la cobertura."; return; }
  syBusy = true;
  try {
    const rows = await sbFetch(`/rest/v1/explotacion?select=data,updated_at&user_id=eq.${SY.session.user}`);
    const remoto = rows?.[0]?.data ? normalize(rows[0].data) : null;
    const local = JSON.parse(JSON.stringify(DB));
    if (remoto && hasDemoIn(local) && !hasDemoIn(remoto) && Object.keys(S).some(t=>remoto[t].length)) { for (const t in S) local[t] = local[t].filter(r=>!r._demo); }
    const m = remoto ? mezclar(local, remoto) : local;
    await sbFetch(`/rest/v1/explotacion`, {method:"POST", headers:{Prefer:"resolution=merge-duplicates,return=minimal"}, body:JSON.stringify({user_id:SY.session.user, data:m, updated_at:new Date().toISOString()})});
    const cambio = JSON.stringify(m) !== JSON.stringify(DB);
    DB = normalize(m); SY.last = now(); sySave(); syMsg = "";
    if (cambio) { await idbPut("kv", STORE_KEY, JSON.parse(JSON.stringify(DB))).catch(()=>{}); if (!$("#dlg").open) render(); }
    if (manual) { toast("Sincronizado"); render(); }
  } catch(e) { syMsg = `No se pudo sincronizar: ${e.message}`; if (manual) { toast(syMsg); render(); } }
  finally { syBusy = false; }
}
const hasDemoIn = d => Object.keys(S).some(t => (d[t]||[]).some(r=>r._demo));

async function copiaDiaria(){
  try {
    const k = today(); const ks = (await idbKeys("snaps")).sort();
    if (!ks.includes(k)) await idbPut("snaps", k, JSON.parse(JSON.stringify(DB)));
    for (const old of ks.slice(0, Math.max(0, ks.length - 13))) await idbDel("snaps", old);
  } catch(e) {}
}
